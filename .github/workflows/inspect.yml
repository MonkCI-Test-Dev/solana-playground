name: Inspect Runner

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: monkci-ubuntu-24.04-4

    steps:
      - name: Inspect runner filesystem
        shell: bash
        run: |
          echo "=== Runner Information ==="
          whoami
          pwd
          hostname

          echo "=== Locate imagegeneration folder ==="
          sudo find / -type d -name "imagegeneration" 2>/dev/null || true

          echo "=== List imagegeneration folder contents ==="
          sudo find / -type d -name "imagegeneration" 2>/dev/null | while read -r dir; do
            echo "Directory: $dir"
            sudo ls -lahR "$dir"
          done

          echo "=== Locate install-nvm and install-git.sh ==="
          sudo find / -type f \( -name "install-nvm" -o -name "install-nvm.sh" -o -name "install-git.sh" \) 2>/dev/null | while read -r file; do
            echo ""
            echo "=== File: $file ==="
            sudo cat "$file"
          done
