
name: Inspect Monk CI Runner Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect GCP Runner Configuration
    runs-on: monkci-ubuntu-24.04-4
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: 1. OS, cloud provider and runner information
        run: |
          set -u
          echo "=== Runner Identity ==="
          whoami
          pwd
          hostname
          id

          echo "=== OS and Kernel ==="
          cat /etc/os-release
          uname -a
          hostnamectl || true
          uptime -p || true

          echo "=== Cloud Provider ==="
          for f in \
            /sys/class/dmi/id/sys_vendor \
            /sys/class/dmi/id/product_name \
            /sys/class/dmi/id/bios_vendor; do
            if [ -r "$f" ]; then
              echo "$f: $(cat "$f")"
            fi
          done

          echo "=== Azure Agent Check ==="
          if [ -f /etc/waagent.conf ]; then
            echo "waagent.conf exists"
            grep -E '^ResourceDisk\.' /etc/waagent.conf || true
          else
            echo "No waagent.conf detected"
          fi

          echo "=== Image Environment ==="
          printenv ImageVersion ImageOS \
            AGENT_TOOLSDIRECTORY RUNNER_TOOL_CACHE \
            2>/dev/null || true

      - name: 2. Disk layout, mounts and swap
        run: |
          set -u
          echo "=== Block Devices ==="
          lsblk -e 7 -o NAME,SIZE,TYPE,ROTA,FSTYPE,MOUNTPOINTS

          echo "=== Root Filesystem ==="
          findmnt -T / -o SOURCE,TARGET,FSTYPE,OPTIONS
          df -hT /

          echo "=== /mnt Exact Mount ==="
          findmnt -M /mnt -o SOURCE,TARGET,FSTYPE,OPTIONS \
            || echo "/mnt is not a separate mount"

          echo "=== /mnt Backing Filesystem ==="
          findmnt -T /mnt -o SOURCE,TARGET,FSTYPE,OPTIONS \
            || true

          echo "=== /etc/fstab ==="
          sudo cat /etc/fstab

          echo "=== Active Swap ==="
          swapon --show --bytes || true
          cat /proc/swaps
          free -h

          echo "=== Swap File Check ==="
          for f in /mnt/swapfile /swapfile; do
            if [ -e "$f" ]; then
              ls -lh "$f"
              stat -c 'Mode=%a Owner=%U Size=%s' "$f"
              findmnt -T "$f" -o SOURCE,TARGET,FSTYPE
            else
              echo "$f does not exist"
            fi
          done

          echo "=== Mount Units ==="
          systemctl list-units --type=mount --all \
            --no-pager | head -70 || true

      - name: 3. Cloud-init and ephemeral disk configuration
        run: |
          set -u
          echo "=== Cloud-init Status ==="
          if command -v cloud-init >/dev/null; then
            sudo cloud-init status --long || true
          else
            echo "cloud-init not installed"
          fi

          echo "=== Cloud-init Configuration Files ==="
          sudo ls -lah /etc/cloud/cloud.cfg.d/ || true

          echo "=== Ephemeral Disk Configuration ==="
          sudo grep -RnsE \
            'ephemeral0|ephemeral[0-9]|device-timeout|/mnt|mounts:|mount_default_fields|mounts:' \
            /etc/cloud/cloud.cfg \
            /etc/cloud/cloud.cfg.d/ \
            2>/dev/null || true

          echo "=== Azure Timeout Configuration ==="
          file=/etc/cloud/cloud.cfg.d/99-azure-resource-disk-timeout.cfg
          if [ -f "$file" ]; then
            sudo cat "$file"
          else
            echo "Azure timeout file is absent"
          fi

          echo "=== Effective Mount Unit ==="
          systemctl show mnt.mount \
            -p LoadState \
            -p ActiveState \
            -p Result \
            -p What \
            -p Where \
            -p Options \
            -p After \
            -p Requires \
            -p Wants || true

          echo "=== Cloud-init Services ==="
          systemctl list-units 'cloud-*' --all \
            --no-pager | head -60 || true

      - name: 4. Boot performance and systemd delays
        run: |
          set -u
          echo "=== Boot Duration ==="
          systemd-analyze time || true

          echo "=== Slowest 40 Services ==="
          systemd-analyze blame | head -40 || true

          echo "=== Critical Boot Chain ==="
          systemd-analyze critical-chain || true

          echo "=== Failed Units ==="
          systemctl --failed --no-pager || true

          echo "=== Missing Device and Mount Errors ==="
          sudo journalctl -b --no-pager -o short-monotonic \
            --grep='timed out|Timed out|Dependency failed|device-timeout|ephemeral0|mnt.mount|swapfile|Failed to mount|Waiting for device' \
            -n 100 || true

          echo "=== cloud-init Boot Durations ==="
          if command -v cloud-init >/dev/null; then
            sudo cloud-init analyze blame 2>&1 \
              | head -60 || true
          fi

      - name: 5. GRUB, ext4 and kernel performance settings
        run: |
          set -u
          echo "=== Kernel Boot Arguments ==="
          cat /proc/cmdline

          echo "=== Root Filesystem Type ==="
          findmnt -no FSTYPE /

          echo "=== Active Root Mount Options ==="
          findmnt -no OPTIONS /

          echo "=== GRUB Configuration ==="
          sudo grep -RnsE \
            '^GRUB_CMDLINE_LINUX|rootflags=' \
            /etc/default/grub \
            /etc/default/grub.d/ \
            2>/dev/null || true

          echo "=== Runner Performance Drop-in ==="
          file=/etc/default/grub.d/99-runner-performance.cfg
          if [ -f "$file" ]; then
            sudo cat "$file"
          else
            echo "Runner GRUB drop-in missing"
          fi

          echo "=== Effective Kernel Values ==="
          for key in \
            vm.max_map_count \
            vm.mmap_rnd_bits \
            fs.inotify.max_user_watches \
            fs.inotify.max_user_instances \
            net.netfilter.nf_conntrack_tcp_be_liberal; do
            printf '%s = ' "$key"
            sysctl -n "$key" 2>/dev/null \
              || echo "Unavailable"
          done

          echo "=== Configured sysctl Entries ==="
          sudo grep -RnsE \
            'vm.max_map_count|vm.mmap_rnd_bits|fs.inotify.max_user_' \
            /etc/sysctl.conf /etc/sysctl.d/ \
            2>/dev/null || true

      - name: 6. Disk read-ahead and udev configuration
        run: |
          set -u
          echo "=== Device Read-ahead ==="
          for f in /sys/block/*/queue/read_ahead_kb; do
            [ -f "$f" ] || continue
            echo "$f = $(cat "$f") KB"
          done

          echo "=== Device Rotational Flags ==="
          for f in /sys/block/*/queue/rotational; do
            [ -f "$f" ] || continue
            echo "$f = $(cat "$f")"
          done

          echo "=== Read-ahead Udev Rule ==="
          file=/etc/udev/rules.d/99-readahead.rules
          if [ -f "$file" ]; then
            sudo cat "$file"
          else
            echo "No read-ahead udev rule"
          fi

          echo "=== Netfilter Udev Rule ==="
          file=/etc/udev/rules.d/50-netfilter.rules
          if [ -f "$file" ]; then
            sudo cat "$file"
          else
            echo "No netfilter udev rule"
          fi

          echo "=== Loaded Netfilter Modules ==="
          lsmod | grep -E 'nf_conntrack|overlay|br_netfilter' \
            || true

      - name: 7. APT configuration and mirror diagnostics
        run: |
          set -u
          echo "=== APT Configuration ==="
          apt-config dump | grep -E \
            'Acquire::Retries|APT::Acquire::Retries|Acquire::http::Timeout|Acquire::https::Timeout|DEP-11|DefaultEnabled' \
            || true

          echo "=== Exact Pester Expected Values ==="
          for key in \
            'Acquire::Retries' \
            'Acquire::http::Timeout' \
            'Acquire::https::Timeout' \
            'Acquire::IndexTargets::deb::DEP-11::DefaultEnabled' \
            'APT::Acquire::Retries'; do
            echo "--- $key ---"
            apt-config dump "$key" || true
          done

          echo "=== APT Configuration File Matches ==="
          sudo grep -RnsE \
            'Acquire::Retries|APT::Acquire::Retries|Acquire::http::Timeout|Acquire::https::Timeout|DEP-11' \
            /etc/apt/apt.conf.d/ \
            2>/dev/null || true

          echo "=== Ubuntu Sources ==="
          for f in \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              grep -E \
                '^(deb |URIs:|Suites:|Components:|Signed-By:)' \
                "$f" || true
            fi
          done

          echo "=== APT Mirror List ==="
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo cat /etc/apt/apt-mirrors.txt
          else
            echo "No apt-mirrors.txt file"
          fi

      - name: 8. Locate build scripts and imagegeneration files
        run: |
          set -u
          echo "=== Relevant Installation Directories ==="
          for dir in \
            /imagegeneration \
            /opt/hostedtoolcache \
            /opt/runner \
            /usr/local/share \
            /home/runner; do
            if [ -d "$dir" ]; then
              echo "--- $dir ---"
              sudo ls -lah "$dir" | head -40
            fi
          done

          echo "=== Locate Provisioning Scripts ==="
          for base in /imagegeneration /opt /usr/local/share /home; do
            [ -d "$base" ] || continue
            sudo find "$base" -maxdepth 6 -type f \
              \( -name 'configure-environment.sh' \
              -o -name 'install-nvm' \
              -o -name 'install-nvm.sh' \
              -o -name 'install-git.sh' \
              -o -name 'Apt.Tests.ps1' \) \
              -print 2>/dev/null || true
          done

          echo "=== Toolcache Variables ==="
          for key in ImageVersion ImageOS \
            AGENT_TOOLSDIRECTORY RUNNER_TOOL_CACHE; do
            if [ -n "${!key:-}" ]; then
              echo "$key=${!key}"
            else
              echo "$key not set"
            fi
          done

          echo "=== Selected Services ==="
          for unit in \
            fwupd-refresh.timer \
            motd-news.timer \
            waagent.service; do
            echo "--- $unit ---"
            systemctl is-enabled "$unit" 2>/dev/null \
              || true
          done

      - name: 9. Final inspection summary
        if: always()
        run: |
          echo "======================================"
          echo "     MONK CI RUNNER SUMMARY"
          echo "======================================"

          echo "OS: $(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "Kernel: $(uname -r)"
          echo "Root FS: $(findmnt -no FSTYPE /)"
          echo "Root Device: $(findmnt -no SOURCE /)"

          if findmnt -M /mnt >/dev/null 2>&1; then
            echo "/mnt: Separate mount"
          else
            echo "/mnt: Not a separate mount"
          fi

          if [ -e /mnt/swapfile ]; then
            echo "Swap file: /mnt/swapfile present"
          else
            echo "Swap file: /mnt/swapfile absent"
          fi

          if [ -f /etc/cloud/cloud.cfg.d/99-azure-resource-disk-timeout.cfg ]; then
            echo "Azure ephemeral0 config: PRESENT"
          else
            echo "Azure ephemeral0 config: ABSENT"
          fi

          echo "Swap:"
          swapon --show || true

          echo "Boot:"
          systemd-analyze time || true

          echo "Inspection completed."
