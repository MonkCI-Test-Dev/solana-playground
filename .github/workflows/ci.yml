name: CI

on:
  workflow_dispatch:

jobs:
  format_client:
    name: Format client
    runs-on: monkci-ubuntu-24.04-32

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "yarn"
          cache-dependency-path: "client/yarn.lock"

      # Always install the version specified in yarn.lock
      - name: Install prettier
        run: |
          prettier_version=$(awk "/^prettier/{getline; print}" yarn.lock | cut -d "\"" -f 2)
          npm i -g prettier@$prettier_version

      - name: Check format
        run: yarn check-format

      - name: debug rust/env
        run: |
          echo "PATH=$PATH"
          echo "--- /etc/environment ---"; cat /etc/environment
          echo "--- .path ---"; cat /home/runner/actions-runner/.path 2>/dev/null || echo "no .path"
          echo "--- .env ---";  cat /home/runner/actions-runner/.env  2>/dev/null || echo "no .env"
          command -v rustup || true

  format_server:
    runs-on: monkci-ubuntu-24.04-4
    name: Format server

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v3

      - name: Add nightly rustfmt
        run: rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt

      - name: Check format
        run: cargo +nightly fmt --check

  format_wasm:
    runs-on: monkci-ubuntu-24.04-4
    name: Format WASM

    defaults:
      run:
        working-directory: wasm

    steps:
      - uses: actions/checkout@v3

      - name: Check format
        run: cargo fmt --check

  clippy_server:
    runs-on: monkci-ubuntu-24.04-4
    name: Clippy Server

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v3

      - name: Add clippy
        run: rustup component add clippy

      - name: Check clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  clippy_wasm:
    runs-on: monkci-ubuntu-24.04-4
    name: Clippy WASM

    defaults:
      run:
        working-directory: wasm

    steps:
      - uses: actions/checkout@v3

      - name: Add clippy
        run: rustup component add clippy

      - name: Check clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build
    runs-on: monkci-ubuntu-24.04-4
    needs:
      [format_client, format_server, format_wasm, clippy_server, clippy_wasm]

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "yarn"
          cache-dependency-path: "client/yarn.lock"

      - name: Sync rust-toolchain
        run: rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Setup
        run: yarn setup

      # This confirms that there are no changes after setup script runs
      - name: Check git status
        run: git status --porcelain | wc -l | grep -q -w "0"

      - name: Build
        run: yarn build
